services:
  pigmenfarm:
    image: ghcr.io/zeozeozeo/pigmenbot:latest
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    container_name: pigmenbot
    restart: unless-stopped
    environment:
      PIGMEN_MODE: ${PIGMEN_MODE:-farm}
      PIGMEN_SERVER: ${PIGMEN_SERVER:?Set PIGMEN_SERVER in .env}
      PIGMEN_USERNAME: ${PIGMEN_USERNAME:?Set PIGMEN_USERNAME in .env}
      PIGMEN_LOGIN_PASSWORD: ${PIGMEN_LOGIN_PASSWORD:-}
      PIGMEN_MIN_HEALTH: ${PIGMEN_MIN_HEALTH:-6.0}
      PIGMEN_MIN_DURABILITY: ${PIGMEN_MIN_DURABILITY:-20}
      PIGMEN_WEBHOOK_URL: ${PIGMEN_WEBHOOK_URL:-}
      PIGMEN_RENDER_DISTANCE: ${PIGMEN_RENDER_DISTANCE:-256}
      PIGMEN_TERRAIN_SAMPLE_BLOCKS: ${PIGMEN_TERRAIN_SAMPLE_BLOCKS:-4}
      PIGMEN_FALSE_ALARM_SECONDS: ${PIGMEN_FALSE_ALARM_SECONDS:-180}
      PIGMEN_WHITELIST: ${PIGMEN_WHITELIST:-}
      PIGMEN_ALERT_REPEATS: ${PIGMEN_ALERT_REPEATS:-5}
      PIGMEN_PLAYER_DATABASE: ${PIGMEN_PLAYER_DATABASE:-/data/players.json}
    volumes:
      - pigmenbot_data:/data

volumes:
  pigmenbot_data:
